id = "hwatch"
name = "hwatch"
version = "0.3.0"
min_herdr_version = "0.9.2"
description = "Keep KubeVirt VMs and tagged Tailscale machines in SSH and Herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "install.sh"]

[[actions]]
id = "help"
title = "hwatch: Setup and configuration guide"
command = ["sh", "launch.sh", "help"]

[[actions]]
id = "doctor"
title = "hwatch: Check setup"
command = ["sh", "launch.sh", "doctor"]

[[actions]]
id = "profile"
title = "hwatch: Manage profiles"
command = ["sh", "launch.sh", "profile"]

[[actions]]
id = "version"
title = "hwatch: Show build version"
command = ["sh", "launch.sh", "version"]

[[actions]]
id = "run"
title = "hwatch: Reconcile once"
command = ["sh", "launch.sh", "run"]

[[actions]]
id = "watch"
title = "hwatch: Open watcher"
command = ["sh", "launch.sh", "watch"]

[[panes]]
id = "profiles"
title = "hwatch profiles"
placement = "overlay"
command = ["sh", "launch.sh", "profile-menu"]

[[panes]]
id = "watcher"
title = "hwatch watcher — Ctrl+C to stop"
placement = "tab"
command = ["sh", "launch.sh", "watch-pane"]
